# /////////////////////////////////////////////////////////////////////
# 🔨 BUILD SYSTEM
# Defines the build backend and requirements
# /////////////////////////////////////////////////////////////////////

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# /////////////////////////////////////////////////////////////////////
# 📦 PROJECT METADATA
# Package information, version, authors, and classifiers
# /////////////////////////////////////////////////////////////////////

[project]
name = "WOMM"
version = "4.0.0"
description = "Universal development tools for Python and JavaScript - Automatic installation, cross-platform configuration, global commands"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "Neuraaak" }]
maintainers = [{ name = "Neuraaak" }]
keywords = [
    "development-tools",
    "python",
    "javascript",
    "automation",
    "project-setup",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# /////////////////////////////////////////////////////////////////////
# 📚 DEPENDENCIES
# Core production dependencies for runtime
# /////////////////////////////////////////////////////////////////////

dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "ezplog>=2.0.0,<3.0.0",
    "InquirerPy>=0.3.4",
    "copier>=9.17,<10",
]

# /////////////////////////////////////////////////////////////////////
# 🛠️ DEPENDENCY GROUPS
# Development, test and docs tooling (PEP 735).
#
# Groups, not extras: this tooling is never part of what a user installs,
# so it has no business in the published metadata. `uv sync --group dev`
# in CI, `--all-groups` for the cache primer.
# /////////////////////////////////////////////////////////////////////

[dependency-groups]
test = [
    # Task runner: declared here rather than in `dev` so the CI test job,
    # which syncs this group alone, can call `poe test-ci` — the single
    # definition of the coverage gate.
    "poethepoet>=0.32",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "import-linter>=2.0.0",
    "grimp>=2.3.0",
]
docs = [
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-section-index>=0.3.0",
    "pymdown-extensions>=10.7",
    "git-cliff>=2.7.0",
    "grimp>=2.3.0",

    # Task runner: 04-docs runs `poe docs-coverage|imports|graph` and syncs
    # only `docs` + `test`, so poethepoet must be reachable from this group.
    "poethepoet>=0.32",
]
dev = [
    # Tests (single source of truth, no duplication)
    { include-group = "test" },

    # Documentation (single source of truth, no duplication)
    { include-group = "docs" },

    # Development tools
    "ruff>=0.1.0",
    "ty>=0.0.13",
    "pyright>=1.1.0",
    "pre-commit>=3.0.0",

    # Task runner
    "poethepoet>=0.32",

    # Security
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",

    # Distribution
    "twine>=4.0.0",
]

# ///////////////////////////////////////////////////////////////
# 🔗 PROJECT URLS
# Links to repository, documentation, and package index
# ///////////////////////////////////////////////////////////////

[project.urls]
Homepage = "https://github.com/neuraaak/WOMM"
Documentation = "https://neuraaak.github.io/WOMM/"
Repository = "https://github.com/neuraaak/WOMM"
Issues = "https://github.com/neuraaak/WOMM/issues"
PyPI = "https://pypi.org/project/WOMM/"

# ///////////////////////////////////////////////////////////////
# 🖥️ SCRIPTS
# Entry points for command-line tools
# ///////////////////////////////////////////////////////////////

[project.scripts]
# Main CLI command
womm = "womm.cli:main"

# ///////////////////////////////////////////////////////////////
# 🏃 DEVELOPMENT TASKS
# Cross-platform command aliases executed through the existing uv environment
# ///////////////////////////////////////////////////////////////

[tool.poe.executor]
type = "uv"
no-sync = true

[tool.poe.tasks]
format = { cmd = "ruff format src tests .scripts", help = "Format code with Ruff" }
format-check = { cmd = "ruff format --check src tests .scripts", help = "Check formatting without modifying files" }
lint = { cmd = "ruff check src tests .scripts", help = "Check code with Ruff" }
lint-fix = { cmd = "ruff check --fix src tests .scripts", help = "Fix Ruff issues automatically" }
typecheck = { cmd = "ty check --output-format=concise", help = "Check types with Ty" }
security = { help = "Run Bandit and audit locked dependencies", sequence = [
    "bandit -c pyproject.toml -r src/womm",
    "pip-audit",
], default_item_type = "cmd" }
test = { cmd = "pytest", help = "Run the test suite" }
test-ci = { cmd = "pytest --cov-fail-under=60", help = "Run the test suite with the coverage gate" }
test-fast = { cmd = "pytest -m 'not slow'", help = "Run tests excluding slow tests" }
test-parallel = { cmd = "pytest -n auto", help = "Run tests in parallel" }
pre-commit = { cmd = "pre-commit run --all-files", help = "Run every pre-commit hook" }
sync-version = { cmd = "python .scripts/dev/update_version.py", help = "Synchronize _version.py with pyproject.toml" }
docs-build = { cmd = "mkdocs build --strict", help = "Build the documentation site" }
docs = { cmd = "mkdocs serve", help = "Serve the documentation locally" }
build = { cmd = "uv build", help = "Build the wheel and the sdist" }
# Machine-readable version for CI: the single source the workflows read,
# instead of each one re-implementing a grep/sed on pyproject.toml.
read-version = '''python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"'''

# import-linter resolves the root package from the current directory, not
# from the path the editable install adds to sys.path. PYTHONPATH=src is
# what makes `womm` discoverable; `source_paths` does not exist in 2.x.
# Reads the live import graph of src/womm and rewrites docs/architecture.md.
# Needs PYTHONPATH=src for the same reason as `imports`.
[tool.poe.tasks.graph]
help = "Generate the architecture graph"
cmd = "python .scripts/dev/generate_architecture_graph.py"
env = { PYTHONPATH = "src" }

# PYTHONIOENCODING: import-linter renders through rich, which falls back to
# the legacy Windows console writer (cp1252) as soon as stdout is not a tty.
# Its spinner glyphs are then unencodable and the run dies on a
# UnicodeEncodeError — in CI, in a pipe, in any redirected output.
[tool.poe.tasks.imports]
help = "Check architecture contracts"
cmd = "lint-imports"
env = { PYTHONPATH = "src", PYTHONIOENCODING = "utf-8" }

[tool.poe.tasks.fix]
help = "Fix lint issues, then format the code"
sequence = ["lint-fix", "format"]

[tool.poe.tasks.check]
help = "Run all local quality checks"
sequence = [
    "format-check",
    "lint",
    "typecheck",
    "imports",
    "test-ci",
]

# ///////////////////////////////////////////////////////////////
# 📦 HATCHLING CONFIGURATION
# Package discovery and inclusion/exclusion patterns
# ///////////////////////////////////////////////////////////////

[tool.hatch.build.targets.wheel]
packages = ["src/womm"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "docs",
    "examples",
    "htmlcov",
    ".hooks",
    ".venv",
    "venv",
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    ".cursor",
    ".tmp",
    "*.pyc",
    "*.pyo",
    "*.log",
    ".coverage",
    "coverage.xml",
    ".DS_Store",
    "Thumbs.db",
]

# /////////////////////////////////////////////////////////////////////
# 🎨 CODE FORMATTING & LINTING TOOLS
# Auto-formatting, import sorting, and style checking
# /////////////////////////////////////////////////////////////////////

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort-compatible import sorting (via ruff)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit security
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long, handled by ruff format
    "B008", # do not perform function calls in argument defaults
    "S101", # assert_used (for tests)
    "S106", # hardcoded_password_funcarg
    "T201", # print statements (for init.py and scripts)
    "S603", # subprocess.run without check=True
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S311", "E501", "ARG002"]
"examples/**/*" = ["T201", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# /////////////////////////////////////////////////////////////////////
# ✅ TYPE CHECKING TOOLS
# Static type analysis with minimal and comprehensive modes
# /////////////////////////////////////////////////////////////////////

# ty: Type checking with minimal configuration
[tool.ty.environment]
python-version = "3.13"
python-platform = "all"
root = ["src", "src/womm"]

[tool.ty.src]
include = ["src/womm/**/*.py"]
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "tests",
    "docs",
    "examples",
]

# Respect .gitignore
respect-ignore-files = true

[tool.ty.terminal]
output-format = "full"
error-on-warning = false

# Pyright: Comprehensive type checking with detailed reporting
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

# Include/exclude paths
include = ["src/womm"]
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "tests",
    "docs",
    "examples",
    "**/node_modules",
    "**/.*",
]

# Reporting rules: flag missing imports and duplicates
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true

# Optional type checking (None safety)
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true

# Tolerance for decorators and complex types
reportUntypedFunctionDecorator = false
reportUntypedClassDecorator = false
reportUntypedBaseClass = false
reportUntypedNamedTuple = false

# Override and consistency checks
reportPrivateUsage = false
reportConstantRedefinition = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructor = true

# /////////////////////////////////////////////////////////////////////
# 🧭 IMPORT LINTER CONTRACTS
# Layer dependency contracts enforced in CI
# ///////////////////////////////////////////////////////////////

[tool.importlinter]
root_packages = ["womm"]
# Note: import-linter 2.x ne supporte pas source_paths (feature pending PR #323).
# Le package doit être installé en mode editable (pip install -e .)
# ou lancer avec PYTHONPATH=src lint-imports

# Couches, de la plus haute à la plus basse. Une couche ne peut importer que
# les couches situées en dessous d'elle.
#   `a | b` : couches soeurs indépendantes, qui ne peuvent pas s'importer.
#   `a : b` : couches soeurs autorisées à s'importer mutuellement.
[[tool.importlinter.contracts]]
name = "layer dependency flow"
type = "layers"
containers = ["womm"]
layers = [
    "cli",
    "commands",
    # Les interfaces orchestrent et renvoient des Result ; l'UI rend et
    # interagit. Aucune des deux ne doit connaître l'autre : c'est la commande
    # qui traduit un Result en affichage.
    "interfaces | ui",
    # Les services portent la logique et les erreurs déclarées. Ils ne peuvent
    # donc atteindre ni l'UI ni les interfaces.
    "services",
    # `shared` et `utils` se référencent mutuellement (configuration ↔
    # détection) : elles forment une seule couche basse.
    "utils : shared",
    "exceptions",
]

# ///////////////////////////////////////////////////////////////
# 🧪 TESTING & COVERAGE TOOLS
# Test execution, coverage analysis, and test configuration
# /////////////////////////////////////////////////////////////////////

# Pytest: Test runner with markers and coverage configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=src/womm",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--tb=short",
    "--color=yes",
    "--durations=10",
    "--maxfail=5",
]
console_output_style = "progress"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "robustness: marks tests as robustness tests",
    "unit: marks tests as unit tests (default)",
    "cli: marks tests related to CLI",
    "smoke: marks tests as smoke tests (app/entrypoint startup checks)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/womm"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.pytest_cache/*",
    "*/.benchmarks/*",
    "*/.vscode/*",
    "*/.egg-info/*",
    "*/.hooks/*",
    "setup.py",
    "build/*",
    "dist/*",
    ".venv/*",
    "venv/*",
    "htmlcov/*",
    "coverage.xml",
    ".coverage",
    "docs/*",
    "examples/*",
    "_temp/*",
    "*/ui/*/wizard.py",
    "*/ui/project/project_wizard.py",
]

[tool.coverage.report]
# Lines to exclude: comments, abstractions, unreachable code
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if platform.system\\(\\) == \"Windows\":",
    "except ImportError:",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

# ///////////////////////////////////////////////////////////////
# 🔒 SECURITY TOOLS
# Code security scanning and vulnerability detection
# ///////////////////////////////////////////////////////////////

# Bandit: Security linter for identifying common security issues
[tool.bandit]
exclude_dirs = [
    "tests",
    "build",
    "dist",
    "venv",
    ".venv",
    ".hooks",
    "docs",
    "examples",
    ".tmp",
    "_temp",
]
skips = ["B101", "B601"]
